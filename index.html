<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A calm, private space to write, open, and preview Markdown."
    />
    <meta name="theme-color" content="#f6f7f9" />
    <title>Markdown Viewer</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Markdown Viewer home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <rect x="2" y="4" width="28" height="24" rx="7" fill="currentColor" />
              <path
                d="M7 20V12h2l3 4 3-4h2v8h-2v-5l-3 4-3-4v5H7Zm13-5h3v-3h2v3h3l-4 5-4-5Z"
                fill="white"
              />
            </svg>
          </span>
          <span class="brand-name">markdown<span>viewer</span></span>
        </a>

        <div class="topbar-actions">
          <span class="privacy-note">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 1.5 2.5 4v3.8c0 3.3 2.3 5.8 5.5 6.7 3.2-.9 5.5-3.4 5.5-6.7V4L8 1.5Zm2.6 4.8-3.1 3.5-2-1.7.9-1 1 .9 2.1-2.5 1.1.8Z" fill="currentColor" />
            </svg>
            Your files stay on your device
          </span>
          <button class="button button-primary" id="open-file-button" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 13.5V3m0 0L6.5 6.5M10 3l3.5 3.5M4 12v4h12v-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Open file
          </button>
          <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain" hidden />
        </div>
      </header>

      <main class="workspace">
        <section class="document-heading" aria-label="Current document">
          <div class="document-info">
            <span class="document-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20">
                <path d="M5 2.75h6l4 4v10.5H5V2.75Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
                <path d="M11 2.9v4h4M7.5 10h5M7.5 13h5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            </span>
            <div>
              <p class="eyebrow">CURRENT DOCUMENT</p>
              <h1 id="document-name">Welcome.md</h1>
            </div>
            <span class="local-badge"><span></span> Local</span>
          </div>
          <div class="document-actions">
            <span id="document-stats" class="document-stats" aria-live="polite">0 words · 0 lines</span>
            <button class="button button-subtle" id="sample-button" type="button" title="Restore the sample document">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 5.5h12M7 5.5V4h6v1.5m2 0-.7 10H5.7L5 5.5m3 3v4m4-4v4" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              Sample
            </button>
          </div>
        </section>

        <section class="panes" aria-label="Markdown editor and preview">
          <div class="pane pane-editor" id="editor-pane">
            <div class="pane-toolbar">
              <div class="pane-title">
                <span class="pane-dot editor-dot"></span>
                <h2>Editor</h2>
                <span class="format-badge">MARKDOWN</span>
              </div>
              <span class="pane-hint">Write or paste Markdown</span>
            </div>
            <div class="editor-wrap">
              <div class="line-gutter" id="line-gutter" aria-hidden="true">1</div>
              <textarea
                id="markdown-input"
                aria-label="Markdown source"
                aria-describedby="editor-help"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                autocorrect="off"
              ></textarea>
            </div>
            <p class="editor-help" id="editor-help">
              <span>Tip</span> Drop a <code>.md</code> file anywhere to open it
            </p>
          </div>

          <div class="pane pane-preview" id="preview-pane">
            <div class="pane-toolbar">
              <div class="pane-title">
                <span class="pane-dot preview-dot"></span>
                <h2>Preview</h2>
              </div>
              <span class="rendered-label">
                <span class="rendered-dot"></span>
                Rendered
              </span>
            </div>
            <article class="preview-content" id="preview-content" aria-label="Rendered Markdown preview"></article>
          </div>
        </section>

        <nav class="mobile-tabs" aria-label="View mode">
          <button class="mobile-tab active" type="button" data-pane="editor-pane" aria-pressed="true">Editor</button>
          <button class="mobile-tab" type="button" data-pane="preview-pane" aria-pressed="false">Preview</button>
        </nav>
      </main>

      <div class="drop-overlay" id="drop-overlay" aria-hidden="true">
        <div class="drop-card">
          <span class="drop-icon" aria-hidden="true">↓</span>
          <strong>Drop your Markdown file</strong>
          <span>We’ll open it right here</span>
        </div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
